steps:
  - name: node:22-alpine
    entrypoint: npm
    args: ['test']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/smart-capturer:$COMMIT_SHA', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/smart-capturer:$COMMIT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - smart-capturer
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/smart-capturer:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=smart-capturer@${PROJECT_ID}.iam.gserviceaccount.com
      - --update-env-vars=STORAGE_BUCKET=${_STORAGE_BUCKET},AI_PROVIDER=${_AI_PROVIDER},GEMINI_MODEL=${_GEMINI_MODEL},OPENAI_MODEL=${_OPENAI_MODEL}
      - --update-secrets=${_AI_KEY_ENV}=${_AI_KEY_SECRET}:${_AI_KEY_VERSION},CAPTURE_ACCESS_KEY=smart-capturer-family-key:latest
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/smart-capturer:$COMMIT_SHA'
substitutions:
  _AI_PROVIDER: gemini
  _GEMINI_MODEL: gemini-2.5-flash
  _OPENAI_MODEL: gpt-5.6-luna
  _AI_KEY_ENV: GEMINI_API_KEY
  _AI_KEY_SECRET: smart-capturer-gemini
  _AI_KEY_VERSION: '1'
  _REGION: us-west1
  _REPOSITORY: smart-capturer
  _STORAGE_BUCKET: hunter-apps-smart-capturer
options:
  logging: CLOUD_LOGGING_ONLY
